<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shape Match</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; font: 14px system-ui, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    canvas[data-mode="rotate"] { cursor: grab; }
    canvas[data-mode="rotate"]:active { cursor: grabbing; }
    canvas[data-mode="select"] { cursor: crosshair; }

    #toolbar { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; }
    .group {
      display: flex; padding: 3px; gap: 3px;
      background: #1e2027; border: 1px solid #333844; border-radius: 8px;
    }
    #toolbar button {
      padding: 6px 12px; border: 0; border-radius: 5px;
      background: transparent; color: #c9ccd3; font: inherit; cursor: pointer;
    }
    #toolbar button:hover { background: #2a2e38; }
    #mode button[aria-pressed="true"] { background: #4a7bd0; color: #fff; }
  </style>
</head>
<body>
  <canvas id="gpuCanvas"></canvas>

  <div id="toolbar">
    <div id="mode" class="group" role="group" aria-label="Mouse mode">
      <button data-mode="rotate" aria-pressed="true" title="Drag to rotate the view">Rotate</button>
      <button data-mode="select" aria-pressed="false" title="Click a point, drag to change its height">Move points</button>
    </div>
    <div class="group">
      <button id="reset" title="Move all control points back to the plane">Reset points</button>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
